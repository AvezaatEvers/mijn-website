<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent | Avezaat &amp; Evers intern</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/style.css?v=126">
<link rel="stylesheet" href="/intern/klanten.css?v=6">
<link rel="stylesheet" href="/intern/app.css?v=4">
<style>
  /* Volledig chatscherm: gesprekken links, chat in het midden */
  body.app main.db.chatpagina { padding: 0; max-width: none; height: 100vh; height: 100dvh; display: grid; grid-template-columns: 272px minmax(0, 1fr); }
  body.app main.db.chatpagina > * { max-width: none; }
  .gs { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: rgba(255, 255, 255, .55); padding: 16px 10px 12px; }
  .gs-nieuw { display: flex; align-items: center; gap: 10px; font: inherit; font-size: 14.5px; font-weight: 600; color: var(--ink); background: #fff; border: 0; border-radius: 12px; padding: 11px 12px; cursor: pointer; box-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 0 0 1px var(--line); transition: background .2s; }
  .gs-nieuw:hover { background: #FAFAFC; }
  .gs-nieuw svg { width: 18px; height: 18px; color: var(--accent); }
  .gs-zoek { margin: 12px 2px 6px; }
  .gs-zoek input { width: 100%; font: inherit; font-size: 13.5px; padding: 8px 10px; border-radius: 9px; border: 0; }
  .gs-lijst { flex: 1; min-height: 0; overflow-y: auto; margin: 4px 0; padding: 0 2px; }
  .gs-groep { font-size: 11.5px; font-weight: 600; color: #A1A1A6; padding: 14px 10px 4px; }
  .gs-item { position: relative; display: flex; align-items: center; gap: 6px; border-radius: 9px; transition: background .15s; }
  body.app .gs-item a { flex: 1; min-width: 0; display: block; padding: 8px 10px; font-size: 14px; color: var(--text); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .gs-item:hover { background: rgba(0, 0, 0, .04); }
  .gs-item.is-aan { background: rgba(0, 0, 0, .07); }
  body.app .gs-item.is-aan a { color: var(--ink); font-weight: 500; }
  .gs-item button { opacity: 0; width: 26px; height: 26px; margin-right: 4px; border: 0; border-radius: 7px; background: none; color: var(--muted); cursor: pointer; font-size: 16px; flex: none; }
  .gs-item:hover button, .gs-item.is-aan button { opacity: 1; }
  .gs-item button:hover { background: rgba(0, 0, 0, .07); color: #D70015; }
  .gs-leeg { padding: 14px 10px; font-size: 13.5px; color: var(--muted); }
  .gs-voet { border-top: 1px solid var(--line); padding: 10px 6px 0; font-size: 12px; color: var(--muted); line-height: 1.5; }
  .gs-voet b { color: var(--text); font-weight: 600; }
  .gs-voet i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #34C759; margin-right: 6px; vertical-align: 1px; }
  .gs-voet i.uit { background: #FF9F0A; }

  .cp { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .cp-kop { display: flex; align-items: center; gap: 10px; padding: 14px 24px; border-bottom: 1px solid var(--line); min-height: 58px; }
  .cp-kop h1 { font-family: var(--sys) !important; font-size: 15.5px !important; font-weight: 600 !important; letter-spacing: -.01em !important; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cp-kop .orb { --m: 26px; }
  .cp-menu { display: none; width: 34px; height: 34px; border-radius: 9px; border: 0; background: rgba(0, 0, 0, .05); cursor: pointer; font-size: 18px; }
  #grote-chat { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #grote-chat .ag-stroom { padding: 28px max(24px, calc((100% - 760px) / 2)) 12px; }
  #grote-chat .ag-invoer { padding: 8px max(24px, calc((100% - 760px) / 2)) 22px; }
  #grote-chat .ag-veld { background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .05), 0 0 0 1px var(--line), 0 10px 30px -18px rgba(0, 0, 0, .2); border-radius: 22px; padding: 10px 10px 10px 18px; }
  #grote-chat .ag-veld textarea { font-size: 16px; }
  #grote-chat .ag-welkom { padding-top: 9vh; }
  #grote-chat .ag-welkom .orb { --m: 96px; }
  #grote-chat .ag-welkom h2 { font-size: 30px; letter-spacing: -.03em; }
  #grote-chat .ag-sug { max-width: 640px; }
  #grote-chat .md { font-size: 15.5px; }
  #grote-chat .ag-msg { margin-bottom: 22px; }
  .ag-laden { display: grid; place-items: center; padding: 18vh 0; }
  body.app.chatmodus .ag-zweef { display: none; }

  @media (max-width: 960px) {
    body.app main.db.chatpagina { grid-template-columns: 1fr; height: calc(100dvh - 56px); }
    .gs { position: fixed; z-index: 60; top: 0; bottom: 0; left: 0; width: min(300px, 86vw); background: #F6F6F8; transform: translateX(-102%); transition: transform .35s var(--veer); box-shadow: 20px 0 50px -20px rgba(0, 0, 0, .3); }
    body.gs-open .gs { transform: none; }
    .cp-menu { display: grid; place-items: center; }
    .cp-kop { padding: 10px 14px; }
  }
</style>
</head>
<body class="chatmodus">
<main class="db chatpagina">
  <aside class="gs" aria-label="Gesprekken">
    <button class="gs-nieuw" type="button" id="nieuw"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Nieuw gesprek</button>
    <div class="gs-zoek"><input id="gs-zoek" type="search" placeholder="Zoek in gesprekken" aria-label="Zoek in gesprekken"></div>
    <nav class="gs-lijst" id="gs-lijst"><div class="gs-leeg">Laden…</div></nav>
    <div class="gs-voet" id="gs-voet"></div>
  </aside>
  <section class="cp">
    <div class="cp-kop"><button class="cp-menu" type="button" id="menu" aria-label="Gesprekken tonen">☰</button><div id="kop-orb"></div><h1 id="titel">Nieuw gesprek</h1></div>
    <div id="grote-chat"></div>
  </section>
</main>

<script src="/intern/app.js?v=3"></script>
<script>
(function () {
  function start() {
    var AE = window.AE, esc = AE.esc, lijst = [], q = '';
    document.getElementById('kop-orb').innerHTML = AE.agent.orb();
    var param = new URLSearchParams(location.search);
    var chat = AE.agent.maakChat(document.getElementById('grote-chat'), { placeholder: 'Stel een vraag, of laat de agent iets voor je doen…', gesprek: param.get('g') || (param.get('nieuw') ? null : undefined) });
    window.AE_GROTE_CHAT = chat;
    if (param.get('q')) setTimeout(function () { chat.vraag(param.get('q')); }, 400);

    function groep(iso) {
      var d = new Date(iso), nu = new Date(), dag = 864e5, verschil = Math.floor((new Date(nu.toDateString()) - new Date(d.toDateString())) / dag);
      return verschil <= 0 ? 'Vandaag' : verschil === 1 ? 'Gisteren' : verschil < 7 ? 'Afgelopen week' : verschil < 31 ? 'Afgelopen maand' : 'Eerder';
    }
    function teken() {
      var huidig = chat.id(), html = '', vorige = '';
      var l = lijst.filter(function (g) { return !q || (g.titel || '').toLowerCase().indexOf(q) > -1; });
      l.forEach(function (g) {
        var gr = groep(g.bijgewerkt);
        if (gr !== vorige) { html += '<div class="gs-groep">' + gr + '</div>'; vorige = gr; }
        html += '<div class="gs-item' + (g.id === huidig ? ' is-aan' : '') + '"><a href="?g=' + encodeURIComponent(g.id) + '" data-g="' + esc(g.id) + '" title="' + esc(g.titel) + '">' + esc(g.titel || 'Gesprek') + '</a><button type="button" data-weg="' + esc(g.id) + '" title="Verwijderen" aria-label="Gesprek verwijderen">×</button></div>';
      });
      document.getElementById('gs-lijst').innerHTML = html || '<div class="gs-leeg">' + (q ? 'Geen gesprekken gevonden.' : 'Nog geen gesprekken. Stel je eerste vraag.') + '</div>';
      var g = lijst.filter(function (x) { return x.id === huidig; })[0];
      document.getElementById('titel').textContent = g ? g.titel : 'Nieuw gesprek';
      document.title = (g ? g.titel + ' | ' : '') + 'Agent | Avezaat & Evers intern';
    }
    function laadLijst() { return AE.api('/intern/api/gesprekken').then(function (r) { lijst = r; teken(); }); }

    document.getElementById('nieuw').addEventListener('click', function () { chat.reset(); history.replaceState(null, '', location.pathname); teken(); document.body.classList.remove('gs-open'); chat.focus(); });
    document.getElementById('gs-zoek').addEventListener('input', function () { q = this.value.trim().toLowerCase(); teken(); });
    document.getElementById('menu').addEventListener('click', function () { document.body.classList.toggle('gs-open'); });
    document.getElementById('gs-lijst').addEventListener('click', function (e) {
      var w = e.target.closest('[data-weg]');
      if (w) {
        if (!w.dataset.zeker) { w.dataset.zeker = '1'; w.textContent = '?'; w.title = 'Klik nogmaals om te verwijderen'; setTimeout(function () { if (w.isConnected) { delete w.dataset.zeker; w.textContent = '×'; } }, 2500); return; }
        var id = w.dataset.weg;
        AE.api('/intern/api/gesprek?id=' + encodeURIComponent(id), { method: 'DELETE' }).then(function () { if (chat.id() === id) chat.reset(); laadLijst(); });
        return;
      }
      var a = e.target.closest('[data-g]'); if (!a) return;
      e.preventDefault(); chat.laad(a.dataset.g); history.replaceState(null, '', '?g=' + encodeURIComponent(a.dataset.g));
      document.body.classList.remove('gs-open');
      setTimeout(teken, 50);
    });
    document.addEventListener('ae:gesprek', function (e) {
      if (e.detail && chat.id()) history.replaceState(null, '', '?g=' + encodeURIComponent(chat.id()));
      laadLijst();
    });
    laadLijst();

    AE.api('/intern/api/agent/status').then(function (s) {
      document.getElementById('gs-voet').innerHTML = s.slim
        ? '<i></i><b>Gemini</b>, gratis. Kent jullie klanten en kennisbank, kan mails opstellen en klanten bijwerken na jouw bevestiging.' + (s.web ? ' Zoekt op het web via Tavily.' : ' <br><b>Webzoeken staat uit:</b> zet een gratis <code>TAVILY_API_KEY</code> in Netlify.')
        : '<i class="uit"></i><b>Lokale modus.</b> Zet <code>GEMINI_API_KEY</code> in Netlify voor de slimme agent.';
    });
  }
  if (window.AE && window.AE.agent) start(); else document.addEventListener('ae:agent-klaar', start);
})();
</script>
</body>
</html>
