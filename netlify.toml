# Netlify-instellingen. Geen build nodig: de site bestaat uit kant-en-klare HTML.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Openbare agenda met btw- en belastingdeadlines (abonneren via webcal)
[[headers]]
  for = "/btw-deadlines.ics"
  [headers.values]
    Content-Type = "text/calendar; charset=utf-8"
    Cache-Control = "public, max-age=3600"
